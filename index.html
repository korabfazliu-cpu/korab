 else if(a==='st_tab'){st.tab=v;st.msg='';st.last=null;render()}
 else if(a==='st_find'){if(/^WONDER(-P)?:/i.test(val('sq'))){onScan(val('sq'));return}st.q=val('sq');const q=st.q.toLowerCase();let key=null;
  for(const k in db.users){if(k.toLowerCase()===q||(db.users[k].mid||'').toLowerCase()===q){key=k;break}}
  st.found=key;st.last=null;say(key?'':'Nuk u gjet klient me këtë ID ose email. Skano QR-në e klientit që të shtohet automatikisht.',!key)}
 else if(a==='st_pts'){const u=db.users[st.found];if(!u)return;const m=MENU.find(x=>x.id==val('spp')),q=parseInt(val('sqty'),10);
  if(!m||!(q>0)){say('Zgjidh produktin dhe shkruaj sasinë.',true);return}
  if(q>100){say('Sasia maksimale është 100.',true);return}
  say(addPurchase(st.found,m,q))}
 else if(a==='st_undo'){const l=st.last,u=l&&db.users[l.key];if(!u){st.last=null;render();return}
  u.pp[l.id]=Math.max(0,Math.round(((u.pp[l.id]||0)-l.add)*100)/100);sp(u);u.orders=(u.orders||[]).filter(o=>o.num!==l.num);st.last=null;save();
  say(`U anulua: ${l.q} × ${l.n} (−${fmtP(l.add)} pikë).`)}
 else if(a==='st_print'){window.print()}
 else if(a==='st_offer'){const u=db.users[st.found],o=u&&(u.offers||[])[+v];if(!o)return;
  if(offerState(o)!=='a'){say('Oferta ka skaduar.',true);return}
  u.offers.splice(+v,1);save();say('Oferta u vlerësua: 1 € zbritje për Churros Large.')}
 else if(a==='st_vuse'){const u=db.users[st.found];if(!u)return;const g=u.vouchers.splice(+v,1)[0];save();say(`Dhurata "${g.n}" u shënua si e përdorur.`)}
 else if(a==='st_addstaff'){const n=val('sn1'),pin=val('sp1');db.staff=db.staff||[];
  if(!n||n.toLowerCase()==='admin'){say('Shkruaj një emër të vlefshëm (jo "admin").',true);return}
  if(db.staff.some(s=>s.name.toLowerCase()===n.toLowerCase())){say('Ky emër ekziston tashmë.',true);return}
  if(!/^\d{4,8}$/.test(pin)){say('PIN-i duhet të ketë 4 deri në 8 shifra.',true);return}
  db.staff.push({id:'S'+Date.now().toString(36),name:n,h:await H(pin)});save();say(`Stafi "${n}" u regjistrua. Hyrja: ${n} + PIN ${pin}.`)}
 else if(a==='st_del'){const s=(db.staff||[]).splice(+v,1)[0];save();say(`Stafi "${s.name}" u fshi.`)}}

let scanS=null,jsqrP=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve();return jsqrP||(jsqrP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='/js/jsqr.js';s.onload=ok;s.onerror=()=>{jsqrP=null;no()};document.head.appendChild(s)}))}
async function startScan(){
 sheet(`<h2 class="fancy">Skano QR-në</h2><div class="scan"><video id="sv" playsinline muted></video></div><p class="mut" id="smsg" style="text-align:center">${st.found&&db.users[st.found]?'Mbaje QR-në e produktit brenda kornizës.':'Mbaje QR-në e klientit brenda kornizës.'}</p><button class="btn ghost wide" style="justify-content:center" data-a="st_scanstop">Mbyll</button>`);
 const msg=m=>{const e=$('smsg');if(e)e.textContent=m};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('Kjo pajisje nuk lejon kamerën këtu. Shkruaj ID-në e klientit.');return}
 let det=null;try{if('BarcodeDetector' in window&&(await BarcodeDetector.getSupportedFormats()).includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
 if(!det){try{await loadJsQR()}catch(e){msg('Skaneri nuk u ngarkua. Kontrollo internetin.');return}}
 let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}catch(e){msg('Kamera nuk u lejua. Lejoje te cilësimet e shfletuesit, ose shkruaj ID-në.');return}
 if(!$('sv')){s.getTracks().forEach(t=>t.stop());return}
 scanS={stream:s,raf:0};const v=$('sv');v.srcObject=s;try{await v.play()}catch(e){}
 const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=false;
 const loop=async()=>{if(!scanS)return;
  if(!busy&&v.readyState>=2&&v.videoWidth){busy=true;let txt=null;
   try{if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue}
    else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)txt=r.data}}catch(e){}
   busy=false;if(txt&&scanS){if(navigator.vibrate)navigator.vibrate(60);onScan(txt);return}}
  if(scanS)scanS.raf=requestAnimationFrame(loop)};
 loop()}
function stopScan(){if(scanS){cancelAnimationFrame(scanS.raf);scanS.stream.getTracks().forEach(t=>t.stop());scanS=null}}
function onScan(txt){stopScan();closeS();
 const say=(m,bad)=>{st.msg=m;st.bad=!!bad;render()};
 const pm=parseP(txt);
 if(pm){st.tab='arka';if(!st.found||!db.users[st.found]){st.last=null;say('Skano fillimisht QR-në e klientit, pastaj produktin.',true);return}say(addPurchase(st.found,pm,1));return}
 if(/^WONDER-P:/i.test(String(txt).trim())){say('Ky produkt nuk ekziston më në meny.',true);return}
 const p=parseQR(txt);
 if(!p){say('Ky QR nuk është i Wonder Club.',true);return}
 let key=Object.keys(db.users).find(k=>(db.users[k].mid||'').toUpperCase()===p.mid),added=false;
 if(!key){if(!p.n){say('Klienti nuk u gjet në këtë pajisje.',true);return}
  key=p.e&&!db.users[p.e]?p.e:'id:'+p.mid;
  db.users[key]={name:p.n,surname:p.s,email:p.e,mid:p.mid,points:0,earned:0,pp:{},balance:0,vouchers:[{n:'Churros Standard falas (dhuratë mirëseardhjeje)',v:2.5}],orders:[],offers:[{n:'1 € zbritje kur blen Churros Large',item:2,off:1}],added:Date.now()};added=true;save()}
 st.tab='arka';st.q=db.users[key].mid;st.found=key;st.last=null;
 say(added?`Klient i ri u shtua: ${db.users[key].name} ${db.users[key].surname}.`:'')}
(function(){let s=null,x0=0,l0=0,mv=false;
document.addEventListener('pointerdown',e=>{mv=false;const el=e.target.closest&&e.target.closest('.sl');if(!el||e.pointerType!=='mouse')return;s=el;x0=e.clientX;l0=el.scrollLeft;el.style.scrollSnapType='none'});
document.addEventListener('pointermove',e=>{if(!s)return;const d=e.clientX-x0;if(Math.abs(d)>5)mv=true;s.scrollLeft=l0-d});
const end=()=>{if(!s)return;s.style.scrollSnapType='';s=null};
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
document.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=false}},true)})();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='sq'){e.preventDefault();const b=document.querySelector('[data-a=st_find]');if(b)b.click();return}if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.mcard,.mi,.ctile')){e.preventDefault();e.target.click()}});
document.addEventListener('scroll',e=>{const s=e.target;if(s&&s.id==='mcar')fx(s);if(s&&s.id==='slp'){const i=Math.round(s.scrollLeft/((s.scrollWidth-s.clientWidth)/(PHOTOS.length-1)));document.querySelectorAll('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i))}},true);
document.addEventListener('change',e=>{if(e.target.id==='bd'){U().bday=e.target.value;save()}});
render();
</script>
