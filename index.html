function barChart(days){if(!days||!days.length)return '';const W=640,H=200,pl=8,pr=8,pt=22,pb=28,max=Math.max(1,...days.map(d=>+d.sales)),bw=(W-pl-pr)/days.length;

function liveSplit(p,label){const tot=CH.reduce((a,[k])=>a+(p&&p[k]?+p[k].t:0),0)+(p&&p.other?+p.other.t:0),rows=[...CH.map(([k,l])=>[k,l]),['other','Vetëm pikë (pa arkë)']].filter(([k])=>k!=='other'||(p&&p.other));
 return `<div class="split" role="img" aria-label="Ndarja e të hyrave ${label}">${tot?rows.filter(([k])=>p&&p[k]&&+p[k].t>0).map(([k,l])=>`<i class="ch-${k}" style="flex:${+p[k].t}" title="${l}: ${eur(p[k].t)}"></i>`).join(''):'<i class="ch-none" style="flex:1"></i>'}</div>`
 +`<table class="stab"><thead><tr><th>Mënyra</th><th>Shitje</th><th>Shuma</th><th>%</th></tr></thead><tbody>${rows.map(([k,l])=>{const v=p&&p[k]?p[k]:{t:0,n:0};return `<tr><td><i class="chd ch-${k}"></i>${l}</td><td>${v.n}</td><td><b>${eur(v.t)}</b></td><td>${tot?Math.round(+v.t/tot*100):0}%</td></tr>`}).join('')}<tr class="tt"><td>Gjithsej</td><td>${rows.reduce((a,[k])=>a+(p&&p[k]?+p[k].n:0),0)}</td><td><b>${eur(tot)}</b></td><td></td></tr></tbody></table>`}
function hourChart(hrs,nowHour){const keys=[...CH.map(c=>c[0]),'other'],sum=h=>keys.reduce((a,k)=>a+(+h[k]||0),0);
 const used=hrs.filter(h=>h.n>0).map(h=>h.h),nowH=nowHour==null?new Date().getHours():+nowHour,a=Math.min(8,...used,nowH),b=Math.max(22,...used,nowH),L=hrs.filter(h=>h.h>=a&&h.h<=b);
 const W=720,H=230,pl=40,pr=6,pt=12,pb=26,max=Math.max(1,...L.map(sum)),nice=max<=20?Math.ceil(max/5)*5:max<=100?Math.ceil(max/20)*20:Math.ceil(max/50)*50,bw=(W-pl-pr)/L.length;
 const y=v=>H-pb-(H-pt-pb)*v/nice,grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(nice*f)}" y2="${y(nice*f)}" class="gl"/><text x="${pl-6}" y="${y(nice*f)+4}" text-anchor="end" class="cl">${Math.round(nice*f)}</text>`).join('');
 return `<svg class="chart hc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Shitjet sot sipas orës dhe mënyrës së pagesës">${grid}`+L.map((h,i)=>{let acc=0;const x=pl+i*bw+bw*.18,w=bw*.64,tot=sum(h);
   const segs=keys.filter(k=>+h[k]>0).map((k,j,arr)=>{const y0=y(acc),y1=y(acc+ +h[k]);acc+=+h[k];const top=j===arr.length-1,hh=Math.max(1,y0-y1-(top?0:2));
     return top?`<path class="ch-${k}" d="M${x} ${y0} V${y1+Math.min(4,hh)} q0 -4 4 -4 H${x+w-4} q4 0 4 4 V${y0} Z"/>`:`<rect class="ch-${k}" x="${x}" y="${y1+2}" width="${w}" height="${hh}"/>`}).join('');
   const tip=`${String(h.h).padStart(2,'0')}:00–${String(h.h+1).padStart(2,'0')}:00 · ${h.n} shitje · ${eur(tot)}`+keys.filter(k=>+h[k]>0).map(k=>`\n${PAYN[k]}: ${eur(h[k])}`).join('');
   return `<g class="hb${h.h===nowH?' now':''}"><title>${tip}</title><rect class="hit" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}"/>${segs}${(h.h%2===0||h.h===nowH)?`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" class="cl${h.h===nowH?' on':''}">${String(h.h).padStart(2,'0')}</text>`:''}</g>`}).join('')+`</svg>`}

// Payment channels, in a fixed order (the dashboard colours follow the channel, never its rank).

 sheet(`<h2 class="fancy" style="margin:0">${PS.q>1?PS.q+' × ':''}${esc(pName(m))}</h2><p class="mut" style="margin:4px 0 10px">Zgjidh ${PS.need} dip sipas klientit. Prek të njëjtin dip disa herë për më shumë.</p>`

 +`<div class="two" style="margin-top:14px"><button class="btn ghost" data-a="close">Anulo</button><button class="btn" data-a="st_sok"${n===PS.need?'':' disabled'}>Shto në faturë</button></div>`)}
const posItems=()=>POS.cart.map(l=>({...l,m:MENU.find(x=>x.id===l.id)})).filter(l=>l.m);
function posTotals(){const sub=r2(posItems().reduce((a,l)=>a+l.m.p*l.q,0));
 let disc=0;const ds=POS.codes.map(c=>{let a=c.type==='pct'?r2(sub*c.pct/100):c.type==='gift'&&!(+c.value>0)?(+String(c.amount||'').replace(',','.')||0):+c.value;a=Math.max(0,a||0);disc+=a;return {...c,a}});
 disc=r2(Math.min(disc,sub));const tot=r2(sub-disc);const cash=+String(POS.cash||'').replace(',','.');
 return {sub,disc,tot,ds,cash,change:isCashPay(POS.pay)&&cash>=tot?r2(cash-tot):null,count:POS.cart.reduce((a,l)=>a+l.q,0)}}

function posGrid(){const cats=['all',...CATS.filter(c=>MENU.some(m=>m.c===c&&m.p)),'Dip'];

 if(T.ds.length)h+=`<div class="bdisc">${T.ds.map((d,i)=>`<div class="bl dl"><span class="t"><b>🏷️ ${esc(d.title)}</b>${d.type==='gift'&&!(+d.value>0)?`<i>Vlera e dhuratës: <input class="gamt" data-i="${i}" type="text" inputmode="decimal" value="${esc(d.amount||'')}" placeholder="€"></i>`:''}</span><b class="lt">−${K(d.a)}</b><button class="x" data-a="st_pdelcode" data-v="${i}" aria-label="Hiqe">×</button></div>`).join('')}</div>`;

 h+=`<p class="err" id="pse"></p><button class="btn pay" data-a="st_psell"${POS.cart.length?'':' disabled'}>Përfundo shitjen · ${K(T.tot)}</button><p class="mut kb">Shkurtore: F9 = përfundo · skaneri USB punon kudo në këtë faqe</p></div>`;

  if(/^WONDER-G:/i.test(s)){const r=await api('redeemCode',{token:ST.tok,code:s});const c=r.card;

   return {stop:true,msg:`✓ U shfrytëzua: ${r.title} · ${c.name} ${c.surname}`}}
  const pp=parseP(s);
  if(pp){if(!st.found)return {bad:true,msg:'Skano fillimisht QR-në e klientit, pastaj produktin.',stop:!cam};
   const msg=await purchase(pp.m.id,pp.q);return {stop:true,msg}}
  if(/^WONDER-P:/i.test(s))return {bad:true,msg:'Ky kod produkti nuk vlen (produkt i panjohur ose sasi mbi 20).',stop:!cam};
  const p=parseQR(s);
  if(!p)return {bad:true,msg:'Ky QR nuk është i Wonder Club.',stop:!cam};
  const c=await api('find',{token:ST.tok,q:p.mid});
  if(!c)return {bad:true,msg:'Ky klient nuk u gjet.',stop:!cam};
  st.found=c;st.q=c.mid;st.tab='arka';st.last=null;
  return {linked:true,stop:!cam,msg:`Klienti u lidh: ${c.name} ${c.surname}.`}
 }catch(x){return {bad:true,msg:errText(x),stop:!cam}}}
